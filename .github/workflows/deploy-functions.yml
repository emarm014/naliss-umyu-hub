name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - enable-terminal-view
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy admin-delete-user Function
        run: supabase functions deploy admin-delete-user --project-ref omrtbnywneezpaozbvzd
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
