name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - enable-terminal-view
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy All Edge Functions
        run: |
          for f in supabase/functions/*; do
            if [ -d "$f" ]; then
              function_name=$(basename "$f")
              echo "Deploying $function_name..."
              supabase functions deploy "$function_name" --project-ref omrtbnywneezpaozbvzd
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
